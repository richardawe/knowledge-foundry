name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,web]"
      # The whole suite runs with no API key and no network: the default LLM
      # and embedding providers are local. A gate that needs a paid API is a
      # gate that eventually gets switched off.
      - name: Test
        run: python -m pytest -q
