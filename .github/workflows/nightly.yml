name: nightly evaluation

# The automated daily health check from PROJECT_INITIATION.md section 12:
#   build -> evaluate -> red team -> regression gate -> publish or hold.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      knowledge_area:
        description: "Knowledge area id"
        required: false
        default: kb-001-battery-failure

jobs:
  nightly:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        knowledge_area:
          - kb-001-battery-failure
          - kb-002-industrial-fire-explosion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,web,pdf]"

      # Restore the previous published report so the regression gate has a
      # baseline to compare against. Without it, every night looks like a
      # first build and nothing can regress.
      - name: Restore baseline
        uses: actions/cache@v4
        with:
          path: var
          key: foundry-${{ matrix.knowledge_area }}-${{ github.run_id }}
          restore-keys: foundry-${{ matrix.knowledge_area }}-

      - name: Build
        run: python -m foundry.cli build ${{ matrix.knowledge_area }} --notes "nightly ${{ github.run_id }}"

      - name: Evaluate
        id: evaluate
        continue-on-error: true
        run: python -m foundry.cli eval ${{ matrix.knowledge_area }}

      - name: Red team
        run: python -m foundry.cli redteam ${{ matrix.knowledge_area }} --count 64 --promote

      - name: Publish or hold
        id: publish
        continue-on-error: true
        run: python -m foundry.cli version ${{ matrix.knowledge_area }} publish

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.knowledge_area }}
          path: var/${{ matrix.knowledge_area }}/reports/

      # Red-team failures and expert challenges are promoted into the
      # knowledge area's regression suite, so the repository has to keep them.
      - name: Commit promoted regression tests
        if: always()
        run: |
          git config user.name "knowledge-foundry-bot"
          git config user.email "noreply@anthropic.com"
          if [ -n "$(git status --porcelain knowledge_areas)" ]; then
            git add knowledge_areas
            git commit -m "Nightly: promote red-team failures for ${{ matrix.knowledge_area }}"
            git push
          else
            echo "nothing new to promote"
          fi

      - name: Fail the run if the build was held
        if: steps.evaluate.outcome == 'failure' || steps.publish.outcome == 'failure'
        run: |
          echo "::error::${{ matrix.knowledge_area }} did not publish. See the report artifact."
          exit 1
