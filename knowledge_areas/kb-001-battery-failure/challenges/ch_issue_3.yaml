system_answer: You must have waste storage and handling procedures. [1] You must store and handle waste
  in a way that makes sure you prevent and minimise pollution risks by using appropriate measures. [1]
  If they cannot be reused, you must make sure they are recycled or recovered at a suitable permitted
  facility. [4] The appropriate measures for waste storage and handling at regulated facilities with an
  environmental permit for the treatment or transfer of waste batteries. [7] You must not carry out activities
  that represent a clear fire risk within waste storage areas. [8]
