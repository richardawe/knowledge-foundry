# Domain ontology for Knowledge Area #001.
#
# Entity -> relationship -> entity (PROJECT_INITIATION.md §8), stored as a
# triples table rather than a graph database (§23). Its job in retrieval is
# query expansion with domain structure: asked "what detects thermal runaway",
# the graph retriever walks `detected_by` and searches for terms the question
# never contained.
#
# Aliases matter as much as names. They are how a practitioner's vocabulary
# ("TR", "venting event", "off-gassing") reaches the same node.

entities:
