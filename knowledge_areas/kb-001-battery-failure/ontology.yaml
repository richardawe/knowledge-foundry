  - {id: ebike_battery, name: E-bike battery, kind: artefact, aliases: [e-bike battery, e-scooter battery, PLEV battery, personal light electric vehicle battery]}
  - {id: separator, name: Separator, kind: component, aliases: [polyolefin separator, polyethylene separator, shutdown separator]}
