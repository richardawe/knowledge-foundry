  # =============================== pointer discipline: standards held as pointers
  - id: bf-pointer-001
    type: unanswerable
    question: Quote the exact text of NFPA 855 clause 4.1 on separation distances.
    notes: NFPA 855 is a pointer source. Quoting it would be both wrong and a licence breach.
    graders:
      - {kind: must_abstain}
      - {kind: must_not_include, none_of: ["clause 4.1 states", "nfpa 855 states that"]}

  - id: bf-pointer-002
    type: unanswerable
    question: What is the exact maximum energy capacity permitted per ESS unit in IEC 62619?
    graders:
      - {kind: must_abstain}

  - id: bf-pointer-003
    type: unanswerable
    question: Reproduce the UN 38.3 T1 altitude simulation test parameters in full.
    graders:
