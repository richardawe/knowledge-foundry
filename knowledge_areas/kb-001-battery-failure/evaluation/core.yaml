suite: core
description: >-
  Curated questions for Knowledge Area #001. Every expected answer was verified
  against the indexed corpus at the time of writing, and every question names
  the source(s) that should supply it so that a retrieval failure and a
  generation failure can be told apart.

questions:

  # =============================================== factual: UK e-bike statutory
  - id: bf-fact-001
    type: factual
    question: How many fatalities occurred in UK fires started by e-bike or e-scooter lithium-ion batteries in 2023?
    expected_sources: [opss-ebike-statutory-guidelines]
    graders:
      - {kind: must_include, any_of: ["10 fatalities", "at least 10"]}
      - {kind: must_cite_source, source_ids: [opss-ebike-statutory-guidelines]}
      - {kind: retrieval_hit, source_ids: [opss-ebike-statutory-guidelines]}

  - id: bf-fact-002
    type: factual
    question: Roughly how many e-bike and e-scooter battery fires were recorded in the UK in 2023?
    expected_sources: [opss-ebike-statutory-guidelines]
    graders:
      - {kind: must_include, any_of: ["200 fires", "almost 200"]}
      - {kind: retrieval_hit, source_ids: [opss-ebike-statutory-guidelines]}

  - id: bf-fact-003
    type: factual
    question: What must an effective battery protection system be capable of detecting under the UK statutory guidelines for e-bike batteries?
    expected_sources: [opss-ebike-statutory-guidelines]
    graders:
      - {kind: must_include, any_of: ["voltage of individual cells", "individual cells"]}
      - {kind: must_cite_type, source_types: [regulatory]}
      - {kind: retrieval_hit, source_ids: [opss-ebike-statutory-guidelines]}

  - id: bf-fact-004
    type: factual
    question: Under which regulation were the UK statutory guidelines on e-bike lithium-ion battery safety made?
    expected_sources: [opss-ebike-statutory-guidelines]
    graders:
      - {kind: must_include, any_of: ["gpsr", "6(3)(c)", "general product safety"]}
      - {kind: retrieval_hit, source_ids: [opss-ebike-statutory-guidelines]}

  - id: bf-fact-005
    type: factual
    question: Must an e-bike battery protection system prevent thermal runaway caused by an incompatible charger?
    expected_sources: [opss-ebike-statutory-guidelines]
    graders:
      - {kind: must_include, any_of: ["incompatible", "charger"]}
      - {kind: must_cite_source, source_ids: [opss-ebike-statutory-guidelines]}

  - id: bf-fact-006
    type: factual
    question: What happens to cells adjacent to a cell in thermal runaway inside a battery pack?
    expected_sources: [opss-ebike-statutory-guidelines]
    graders:
      - {kind: must_include, any_of: ["cascading", "adjacent", "additional cells"]}
      - {kind: max_unsupported, value: 0.34}

